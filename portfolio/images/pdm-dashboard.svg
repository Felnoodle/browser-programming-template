    <rect x="484" y="146" width="110" height="10" rx="5" fill="#2a3042"/><rect x="484" y="146" width="96" height="10" rx="5" fill="#3fb37f"/>
    <rect x="484" y="176" width="110" height="10" rx="5" fill="#2a3042"/><rect x="484" y="176" width="78" height="10" rx="5" fill="#3fb37f"/>
    <rect x="484" y="206" width="110" height="10" rx="5" fill="#2a3042"/><rect x="484" y="206" width="52" height="10" rx="5" fill="#e6a23c"/>
    <rect x="484" y="236" width="110" height="10" rx="5" fill="#2a3042"/><rect x="484" y="236" width="40" height="10" rx="5" fill="#e6a23c"/>
    <rect x="484" y="266" width="110" height="10" rx="5" fill="#2a3042"/><rect x="484" y="266" width="16" height="10" rx="5" fill="#e5484d"/>
  </g>
