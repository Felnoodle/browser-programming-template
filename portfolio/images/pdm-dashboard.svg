<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="360" fill="#121622"/>
  <rect x="0" y="0" width="120" height="360" fill="#171b26"/>
  <g fill="#2a3042"><rect x="16" y="24" width="88" height="10" rx="5"/><rect x="16" y="56" width="70" height="8" rx="4"/><rect x="16" y="76" width="80" height="8" rx="4"/><rect x="16" y="96" width="60" height="8" rx="4"/></g>
  <!-- KPI tiles -->
  <g>
    <rect x="140" y="24" width="150" height="64" rx="8" fill="#1c2030"/>
    <rect x="304" y="24" width="150" height="64" rx="8" fill="#1c2030"/>
    <rect x="468" y="24" width="150" height="64" rx="8" fill="#1c2030"/>
    <circle cx="160" cy="44" r="6" fill="#3fb37f"/><text x="174" y="48" fill="#8a90a4" font-size="11">Healthy</text><text x="156" y="76" fill="#eaedf6" font-size="22" font-weight="700">14</text>
    <circle cx="324" cy="44" r="6" fill="#e6a23c"/><text x="338" y="48" fill="#8a90a4" font-size="11">Warning</text><text x="320" y="76" fill="#eaedf6" font-size="22" font-weight="700">3</text>
    <circle cx="488" cy="44" r="6" fill="#e5484d"/><text x="502" y="48" fill="#8a90a4" font-size="11">Critical</text><text x="484" y="76" fill="#eaedf6" font-size="22" font-weight="700">1</text>
  </g>
  <!-- health timeline -->
  <rect x="140" y="104" width="314" height="232" rx="8" fill="#1c2030"/>
