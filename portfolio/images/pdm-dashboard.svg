  <path d="M156 160 L190 162 L220 165 L250 170 L280 176 L310 186 L340 200 L370 222 L400 252 L438 296" fill="none" stroke="#d946a8" stroke-width="3" stroke-linejoin="round"/>
  <line x1="156" y1="250" x2="438" y2="250" stroke="#e6a23c" stroke-dasharray="5 5"/>
  <!-- RUL bars -->
  <rect x="468" y="104" width="150" height="232" rx="8" fill="#1c2030"/>
