<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1430"/><stop offset="1" stop-color="#2a1f3d"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b6b4a"/><stop offset="1" stop-color="#25452f"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <g fill="#f2e7c9" opacity=".7"><circle cx="80" cy="50" r="1.5"/><circle cx="190" cy="90" r="1"/><circle cx="540" cy="40" r="1.5"/><circle cx="470" cy="100" r="1"/><circle cx="320" cy="30" r="1"/></g>
  <circle cx="520" cy="80" r="26" fill="#f2e7c9" opacity=".85"/>
  <!-- isometric ground -->
  <polygon points="320,140 560,260 320,380 80,260" fill="url(#tile)"/>
  <polygon points="320,140 560,260 320,380 80,260" fill="none" stroke="#5f9a6c" stroke-opacity=".35"/>
  <g stroke="#5f9a6c" stroke-opacity=".25"><line x1="200" y1="200" x2="440" y2="320"/><line x1="440" y1="200" x2="200" y2="320"/><line x1="140" y1="230" x2="380" y2="350"/><line x1="500" y1="230" x2="260" y2="350"/></g>
  <!-- blight patch -->
  <ellipse cx="420" cy="270" rx="70" ry="30" fill="#7a2f6b" opacity=".45"/>
  <!-- trees -->
  <g><rect x="146" y="200" width="8" height="30" fill="#4a3426"/><polygon points="150,140 125,205 175,205" fill="#2f5a3b"/></g>
  <g><rect x="476" y="190" width="8" height="30" fill="#3a2a30"/><polygon points="480,135 455,195 505,195" fill="#5b2f55"/></g>
  <!-- party tokens -->
  <g stroke="#0f1118" stroke-width="2">
    <circle cx="290" cy="250" r="12" fill="#c98a3c"/>
    <circle cx="320" cy="262" r="12" fill="#3a3a52"/>
    <circle cx="350" cy="250" r="12" fill="#d9c27a"/>
    <circle cx="320" cy="236" r="12" fill="#8fbf8a"/>
  </g>
  <!-- enemy -->
  <circle cx="430" cy="262" r="16" fill="#d946a8" stroke="#0f1118" stroke-width="2"/>
  <path d="M405 240 l-14 -8 M455 240 l14 -8" stroke="#d946a8" stroke-width="2"/>
  <!-- turn icons -->
  <g fill="#f2e7c9"><polygon points="40,32 52,24 64,32 52,40"/><polygon points="72,32 84,24 96,32 84,40"/><polygon points="104,32 116,24 128,32 116,40" opacity=".35"/></g>
</svg>
