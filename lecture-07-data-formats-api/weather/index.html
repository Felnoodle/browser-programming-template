<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="exercise.css">
</head>
<body>

    <h1>Weather Dashboard</h1>

    <p>This page loads current weather data from a public API.</p>

    <input type="text" id="cityInput" placeholder="Enter city name (e.g. Kuopio)"></input>
    <input type="number" id="latInput" placeholder="Latitude (e.g. 62.8924)" />
    <input type="number" id="lonInput" placeholder="Longitude (e.g. 27.6770)" />
    <button id="inputBtn">Load Weather</button>
</br>
    <button id="Kuopio">Kuopio</button>
    <button id="Helsinki">Helsinki</button>
    <button id="Oulu">Oulu</button>
    <button id="Kilpisjärvi">Kilpisjärvi</button>

    <div id="weatherBox">
        <p><strong>City:</strong> <span id="city">-</span></p>
        <p><strong>Temperature:</strong> <span id="temperature">-</span></p>
        <p><strong>Wind Speed:</strong> <span id="wind">-</span></p>
        <p><strong>Time:</strong> <span id="time">-</span></p>
    </div>

    <pre id="output"></pre>

    <script src="script.js"></script>
</body>
</html>
